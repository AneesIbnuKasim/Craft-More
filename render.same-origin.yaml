services:
  - type: web
    name: craft-more
    runtime: node
    buildCommand: npm ci && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_DAYS
        value: 7
      - key: STORE_TIMEZONE
        value: Asia/Kolkata
      - key: CLIENT_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: 1
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: lax
      - key: SERVE_CLIENT
        value: true
      - key: VITE_API_BASE_URL
        value: /api
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
